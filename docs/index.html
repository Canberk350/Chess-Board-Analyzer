<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Autonomous Chess-Playing Robot — Demo</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #58a6ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    padding: 32px 16px 64px;
  }
  main {
    max-width: 900px;
    margin: 0 auto;
  }
  h1 {
    font-size: 1.6rem;
    margin: 0 0 6px;
  }
  .subtitle {
    color: var(--muted);
    margin: 0 0 28px;
    font-size: 0.95rem;
  }
  video {
    width: 100%;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: #000;
    display: block;
  }
  .links {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 24px;
  }
  .links a {
    color: var(--accent);
    text-decoration: none;
    border: 1px solid var(--border);
    background: var(--panel);
    padding: 8px 14px;
    border-radius: 6px;
    font-size: 0.9rem;
  }
  .links a:hover {
    border-color: var(--accent);
  }
  footer {
    margin-top: 36px;
    color: var(--muted);
    font-size: 0.8rem;
  }
</style>
</head>
<body>
<main>
  <h1>Autonomous Chess-Playing Robot</h1>
  <p class="subtitle">CENG 483 – Behavioral Robotics · Group 10 · Izmir Institute of Technology — demo recording</p>

  <video controls preload="metadata" poster="thumbnail.jpg">
    <source src="https://raw.githubusercontent.com/Canberk350/Chess-Board-Analyzer/main/demo.mp4" type="video/mp4">
    Your browser doesn't support embedded video. You can
    <a href="https://raw.githubusercontent.com/Canberk350/Chess-Board-Analyzer/main/demo.mp4">download the file directly</a>.
  </video>

  <div class="links">
    <a href="https://github.com/Canberk350/Chess-Board-Analyzer">&larr; Back to repository</a>
    <a href="https://github.com/Canberk350/Chess-Board-Analyzer/blob/main/G10_CENG483_FinalReport.pdf">Final Report (PDF)</a>
    <a href="https://github.com/Canberk350/Chess-Board-Analyzer/blob/main/G10_CENG483_FinalPresentation.pptx">Final Presentation (PPTX)</a>
  </div>

  <footer>Chess-Board-Analyzer — Group 10, Fall 2025</footer>
</main>
</body>
</html>
